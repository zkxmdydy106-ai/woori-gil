<!doctype html>
<!-- roles.html: 1인 1역 배정표. 역할 목록과 학생 명단으로 기간마다 역할을 공평하게 돌려 배정한다. 이름은 이 화면에서만 쓰고 어디에도 보내지 않는다(선택 시 이 기기에만 기억). -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1인 1역 배정표</title>
<style>
:root{--bg:#f4f6f5;--card:#fcfdfc;--text:#17201c;--muted:#56625c;--line:#dde3df;--accent:#14684e;--soft:#e1efe8;--on:#f6fbf8;--warn:#8a5300;--warnbg:#fbf1e2;--sel:#fff2c2;--selline:#b88a00;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101412;--card:#171c19;--text:#e6ece8;--muted:#a3aea8;--line:#29312d;--accent:#4fb48d;--soft:#1a2e25;--on:#0b1510;--warn:#f0b45c;--warnbg:#2b2213;--sel:#3a3112;--selline:#e0b84a;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.55;word-break:keep-all}
main{max-width:1240px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;letter-spacing:-.03em;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 18px}
h2{font-size:16px;margin:22px 0 8px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
h2:first-child{margin-top:0}
h2 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:13px}
.grid{display:grid;grid-template-columns:400px minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
label{font-weight:600;font-size:14.5px}
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 5px}
.help{font-weight:400;color:var(--muted);font-size:13px}
textarea,input[type=text],input[type=number],input[type=date],input[type=search],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:var(--bg);color:var(--text);min-height:40px}
textarea{min-height:120px;resize:vertical;font-size:14.5px}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:650;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.45;cursor:default;border-color:var(--line)}
button.p{background:var(--accent);border-color:var(--accent);color:var(--on)}
button.ic{padding:0;width:36px;min-height:36px}
button.sm{min-height:32px;padding:0 10px;font-size:13.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;font-size:14px;margin-top:12px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.msg{font-size:13.5px;color:var(--warn);min-height:1.2em;margin:6px 0 0}
.msg.ok{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:32px;padding:0 10px;border-radius:999px;font-size:13.5px;font-weight:600}
.chip[aria-pressed=true]{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.chip.out{text-decoration:line-through;color:var(--muted);background:var(--bg)}
.chip.dup{border-color:var(--warn);color:var(--warn)}
.cnt{font-size:13px;color:var(--muted);font-weight:500}
/* 역할 편집 */
.roles{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.role{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);display:grid;gap:6px}
.rtop,.rbot{display:flex;gap:6px;align-items:center}
.rtop input,.rbot input{min-height:36px;padding:6px 9px;background:var(--card);flex:1;min-width:0;width:auto}
.rtop .rname{font-weight:650}
.rbot .rdesc{font-size:13.5px}
.rnum{flex:none;width:24px;text-align:center;color:var(--muted);font-size:13px;font-weight:650}
.step{flex:none;display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.step button{border:0;min-height:34px;width:32px;padding:0;background:transparent}
.step output{min-width:30px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.step output::after{content:"명";font-size:11.5px;font-weight:500;color:var(--muted);margin-left:1px}
.slots{margin-top:10px;border-radius:10px;padding:10px 12px;font-size:13.5px;background:var(--soft);color:var(--text)}
.slots.warn{background:var(--warnbg)}
.slots b{color:var(--accent)}.slots.warn b{color:var(--warn)}
.slots .row{margin-top:8px}
.period{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.period .full{grid-column:1/-1}
.period label{display:block;font-size:13.5px;margin-bottom:4px}
.nrow{display:flex;gap:6px}.nrow input{width:90px;flex:none}
details{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
summary{cursor:pointer;font-weight:650;font-size:14.5px}
details .chips{margin-top:8px}
.prelist{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.prelist li{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 10px}
.prelist li span{flex:1}
.mini{font-size:12.5px;color:var(--muted);margin:10px 0 2px;font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
/* 결과 */
.titlein{font-size:18px;font-weight:700;min-height:44px}
.bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0 4px}
.tabs{display:flex;gap:4px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:12px;max-width:100%;overflow-x:auto}
.tabs button{border:0;min-height:36px;background:transparent;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:48px 12px}
.phead{display:flex;align-items:center;gap:10px;margin:10px 0 14px}
.phead .mid{flex:1;text-align:center;min-width:0}
.ptitle{font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.25}
.plabel{color:var(--accent);font-weight:700;font-size:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.rc{border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;background:var(--card);box-shadow:inset 0 4px 0 var(--accent);display:flex;flex-direction:column;gap:4px;break-inside:avoid}
.rc.h{box-shadow:inset 0 4px 0 var(--muted)}
.rc .rn{font-weight:800;font-size:16.5px;display:flex;gap:8px;align-items:baseline;letter-spacing:-.02em}
.rc .rn i{font-style:normal;font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);border-radius:6px;padding:0 6px}
.rc .rd{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.nm{min-height:36px;padding:0 12px;border-radius:999px;font-size:16px;font-weight:750;background:var(--soft);border:1.5px solid transparent;color:var(--text)}
.nm:hover{border-color:var(--accent)}
.nm.sel{background:var(--sel);border-color:var(--selline)}
.nm svg{width:14px;height:14px;color:var(--accent)}
.slot{min-height:36px;border:1.5px dashed var(--line);border-radius:999px;font-size:13px;color:var(--muted);font-weight:500;background:transparent}
.hint{font-size:13px;color:var(--muted);margin:12px 0 0}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin:10px 0}
.seg button{border:0;min-height:32px;font-size:13.5px;background:transparent}
.seg button[aria-pressed=true]{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;max-width:100%;-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;font-size:14px;width:max-content;min-width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;background:var(--card)}
thead th{background:var(--bg);font-size:13.5px;white-space:nowrap;position:sticky;top:0}
tbody th{position:sticky;left:0;z-index:1;min-width:120px;max-width:160px;font-weight:700}
thead th:first-child{position:sticky;left:0;z-index:2}
th.now,td.now{background:var(--soft)}
td .nm{min-height:30px;font-size:14px;padding:0 9px;margin:2px 2px 2px 0}
td .slot{min-height:30px;margin:2px 0}
td .rl{display:inline-block}
td .nm.rl{background:transparent;border-color:var(--line);font-weight:600}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.sc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);break-inside:avoid}
.sc h3{margin:0 0 4px;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.sc h3 small{font-size:12px;color:var(--muted);font-weight:500}
.sc ol{list-style:none;margin:0;padding:0;font-size:13.5px}
.sc li{display:flex;gap:8px;padding:2px 0;border-top:1px dashed var(--line)}
.sc li:first-child{border-top:0}
.sc li b{flex:none;min-width:58px;color:var(--muted);font-weight:600}
.sc li.now{color:var(--accent);font-weight:700}
.print-only{display:none}
/* 크게 보기 */
.show{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:clamp(14px,3vw,40px)}
.show[hidden]{display:none}
.show .phead{margin-top:0}
.show .ptitle{font-size:clamp(26px,4vw,52px)}
.show .plabel{font-size:clamp(18px,2.4vw,30px)}
.show .pgrid{grid-template-columns:repeat(auto-fill,minmax(clamp(200px,22vw,320px),1fr));gap:clamp(10px,1.4vw,18px)}
.show .rc .rn{font-size:clamp(18px,2vw,28px)}
.show .rc .rd{font-size:clamp(13px,1.3vw,18px)}
.show .nm{font-size:clamp(17px,2vw,28px);min-height:clamp(36px,3.6vw,52px);padding:0 clamp(12px,1.2vw,18px);cursor:default}
.show .close{position:fixed;top:12px;right:12px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
@media (max-width:480px){h1{font-size:22px}.ptitle{font-size:20px}.pgrid{grid-template-columns:1fr 1fr}.rc{padding:10px}.nm{font-size:15px}.period{grid-template-columns:1fr}.tools button .t{display:none}.tools button{padding:0;width:40px}.rc .rn{font-size:15px}}
@media (max-width:360px){.pgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.nm,.rc,button{transition:background-color .15s,border-color .15s}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@page{size:A4;margin:12mm}
@page wide{size:A4 landscape;margin:10mm}
@media print{
  :root{--bg:#fff;--card:#fff;--text:#000;--muted:#444;--line:#999;--soft:#eef4f1;--accent:#14684e;color-scheme:light}
  body{background:#fff;color:#000}
  main{padding:0;max-width:none}
  .no-print,.show{display:none!important}
  .print-only{display:block}
  .grid{display:block}.card{border:0;padding:0}
  .nm{background:transparent;border:1px solid #999;min-height:0;padding:1px 8px;font-size:14px}
  .nm.sel{background:transparent;border-color:#999}
  .slot{display:none}
  .phead{margin:0 0 10px}
  .ptitle{font-size:26px}
  .pgrid{grid-template-columns:repeat(3,1fr);gap:8px}
  .rc{border:1px solid #999;box-shadow:inset 0 3px 0 #333;padding:10px 10px 8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tw{overflow:visible;border:0}
  body.v-table main{page:wide}
  th,td{vertical-align:middle}
  table{width:100%;font-size:11px}
  th,td{position:static!important;border-color:#999;padding:3px 5px}
  td .nm{font-size:11px;padding:0 5px;border:0;margin:0 4px 0 0}
  th.now,td.now{background:#fff}
  .sgrid{grid-template-columns:repeat(4,1fr);gap:6px}
  .sc{padding:6px 8px}.sc li{font-size:11.5px}
  .sc li.now{color:#000}
  .ph{font-size:18px;font-weight:800;margin:0 0 8px}
}
</style>
</head>
<body>
<main>
  <h1 class="no-print">1인 1역 배정표</h1>
  <p class="sub no-print">역할과 학생 이름을 넣으면 기간마다 역할을 공평하게 돌려 배정해요. 이름은 이 화면에서만 쓰고 어디에도 보내지 않아요.</p>
  <div class="grid">
    <section class="card no-print" aria-label="설정">
      <h2><span class="n">1</span>학생 명단</h2>
      <div class="lab"><label for="names">학생 이름 <span class="help">한 줄에 한 명, 쉼표·탭도 돼요</span></label><span class="cnt" id="count">0명</span></div>
      <textarea id="names" placeholder="예) 가람&#10;나래&#10;다온" spellcheck="false"></textarea>
      <p class="msg" id="rosterMsg" role="status"></p>
      <div id="exWrap" hidden>
        <p class="mini">누르면 배정에서 빼요 (전학·장기 결석 등)</p>
        <div class="chips" id="exChips"></div>
      </div>

      <h2><span class="n">2</span>역할 목록</h2>
      <ul class="roles" id="roles"></ul>
      <div class="row" style="margin-top:8px"><button type="button" id="addRole" class="sm" data-ic="plus">역할 추가</button><button type="button" id="sampleRoles" class="sm">예시 역할로 바꾸기</button></div>
      <div class="slots" id="slots" role="status"></div>

      <h2><span class="n">3</span>바꾸는 주기</h2>
      <div class="period">
        <div><label for="mode">주기</label><select id="mode"><option value="month">매월</option><option value="2w">2주마다</option><option value="week">매주</option><option value="sem">학기마다</option></select></div>
        <div><label for="start">시작일</label><input type="date" id="start"></div>
        <div class="full"><label for="n">기간 수</label><div class="nrow"><input type="number" id="n" min="1" max="52" value="5"><button type="button" id="autoN" class="sm">학년 말(2월)까지</button></div></div>
      </div>

      <details id="preBox">
        <summary>희망 역할·고정 정하기 <span class="help">(선택)</span></summary>
        <p class="help" style="margin:6px 0 0">학생 이름을 누른 뒤 역할을 누르면 <b>첫 기간</b>에 그 역할을 맡아요. <b>고정</b>을 켜면 모든 기간 같은 역할을 해요.</p>
        <p class="mini">학생</p>
        <div class="chips" id="preStu"></div>
        <p class="mini">역할</p>
        <div class="chips" id="preRoles"></div>
        <ul class="prelist" id="preList"></ul>
        <p class="msg" id="preMsg" role="status"></p>
      </details>

      <label class="chk"><input type="checkbox" id="remember"><span>이 기기에 기억하기 <span class="help">(이 브라우저에만 저장)</span></span></label>
      <div class="acts"><button type="button" class="p" id="sample">예시 넣기</button><button type="button" id="clear">명단 비우기</button></div>
    </section>

    <section class="card" aria-label="배정 결과">
      <input type="text" id="title" class="titlein no-print" aria-label="제목" value="우리 반 1인 1역" maxlength="40">
      <div class="bar no-print">
        <div class="tabs" role="tablist" aria-label="보기">
          <button type="button" role="tab" id="tab-poster" data-view="poster" aria-selected="true">이번 달</button>
          <button type="button" role="tab" id="tab-table" data-view="table" aria-selected="false">전체표</button>
          <button type="button" role="tab" id="tab-student" data-view="student" aria-selected="false">학생별</button>
        </div>
        <div class="tools">
          <button type="button" id="big" data-ic="expand" title="크게 보기 (교실 TV)"><span class="t">크게 보기</span></button>
          <button type="button" id="shuffle" data-ic="shuffle" title="다시 섞기"><span class="t">다시 섞기</span></button>
          <button type="button" id="undo" data-ic="undo" title="되돌리기" disabled><span class="t">되돌리기</span></button>
          <button type="button" id="copy" data-ic="copy" title="표로 복사"><span class="t">표로 복사</span></button>
          <button type="button" id="print" data-ic="print" title="인쇄"><span class="t">인쇄</span></button>
        </div>
      </div>
      <p class="msg no-print" id="msg" role="status" aria-live="polite"></p>
      <div id="view" role="tabpanel"></div>
    </section>
  </div>
</main>

<div class="show" id="show" hidden role="dialog" aria-modal="true" aria-label="크게 보기">
  <button type="button" class="close" id="closeShow" data-ic="x">닫기 (Esc)</button>
  <div id="showBody"></div>
</div>

<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const ROSTER_KEY = 'gil.class.roster.v1';
  const KEY = 'gil.roles.v2';
  const HELP = '_h';
  const SAMPLE_NAMES = ['가람', '나래', '다온', '라온', '마루', '바다', '사랑', '아름', '자람', '하늘', '한결', '소담', '이든', '도담', '새봄', '여름', '윤슬', '보람', '슬기', '미르', '누리', '단비', '별하', '초롱', '해솔', '온유'];
  // [이름, 할 일, 인원, 여럿이 해도 좋은 역할]
  const SAMPLE_ROLES = [
    ['칠판 지킴이', '쉬는 시간마다 칠판을 지우고 분필·마커를 챙겨요', 2, false],
    ['우유 당번', '우유 상자를 가져오고 빈 팩을 정리해요', 2, true],
    ['출석부 도우미', '출석부를 교무실에서 가져오고 돌려놔요', 1, false],
    ['전등·에어컨', '이동 수업과 하교 때 전등과 냉난방기를 꺼요', 1, false],
    ['창문 환기', '쉬는 시간에 창문을 열어 공기를 바꿔요', 2, true],
    ['분리수거', '종이·플라스틱을 나눠 버리고 통을 비워요', 3, true],
    ['게시판 꾸미기', '학급 게시판 자료를 바꿔 붙이고 정리해요', 2, true],
    ['학급 문고', '책을 제자리에 꽂고 빌린 책을 확인해요', 2, true],
    ['급식 안내', '급식 순서를 안내하고 줄을 정리해요', 2, true],
    ['알림장 기록', '칠판에 오늘의 알림과 준비물을 적어요', 1, false],
    ['화분 물주기', '월·목요일에 화분에 물을 줘요', 1, true],

  /* ---------- 날짜 ---------- */
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const parseYmd = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
  const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  function defaultStart(mode) {
    const t = today();

  const schoolEnd = (d) => new Date(d.getMonth() >= 2 ? d.getFullYear() + 1 : d.getFullYear(), 2, 0); // 학년 말 = 2월 말일
  const semOf = (d) => { const m = d.getMonth() + 1, y = d.getFullYear(); return m >= 3 && m <= 8 ? { y, s: 1 } : m >= 9 ? { y, s: 2 } : { y: y - 1, s: 2 }; };
  const startOf = (st) => parseYmd(st.start) || defaultStart(st.mode);
  function autoN(mode, start) {
    const end = schoolEnd(start); let n;
    if (mode === 'month') n = (end.getFullYear() - start.getFullYear()) * 12 + end.getMonth() - start.getMonth() + 1;
    else if (mode === 'sem') n = semOf(start).s === 1 ? 2 : 1;
    else { const len = mode === 'week' ? 7 : 14; n = Math.ceil((Math.round((end - start) / 864e5) + 1) / len); }

  function periodsOf(st) {

        const s = semOf(s0); const k = s.s - 1 + i; const y = s.y + Math.floor(k / 2); const sem = (k % 2) + 1;
        a = sem === 1 ? new Date(y, 2, 1) : new Date(y, 8, 1); b = sem === 1 ? new Date(y, 8, 1) : new Date(y + 1, 2, 1);

  /* ---------- 명단 ---------- */
  function parseNames(text) {

      const s = raw.replace(/^\s*\d+\s*(?:번|[.)\]:\-])?\s*/, '').replace(/\s+/g, ' ').trim();

      cnt.set(s, (cnt.get(s) || 0) + 1);

  /* ---------- 상태 ---------- */

  const S = {

  const roleName = (id, m) => id === HELP ? '도우미' : (m[id] ? (m[id].name || '(이름 없는 역할)') : '(지운 역할)');
  function activePre(list) {

  /* 자리 계산: 학생이 많으면 도우미, 적으면 여럿이 하는 역할부터 한 자리씩 줄인다 */
  function capsFor(list, roles, pre) {
    const total = roles.reduce((a, r) => a + r.count, 0), N = list.length, cap = {};

    const n = a.length, m = a[0].length, INF = 1e18;
    const u = new Array(n + 1).fill(0), v = new Array(m + 1).fill(0), p = new Array(m + 1).fill(0), way = new Array(m + 1).fill(0);
    for (let i = 1; i <= n; i++) {

      do {

    }
    const ans = new Array(n).fill(-1);
    for (let j = 1; j <= m; j++) if (p[j]) ans[p[j] - 1] = j - 1;

  }

  function sigOf() {

  }

  function generate() {
    const list = students(), roles = S.roles, pre = activePre(list);
    const { cap, helpers } = capsFor(list, roles, pre);
    const rng = rngOf(S.seed), hist = {}, prev = {}, periods = [];

    for (let p = 0; p < S.n; p++) {

      list.forEach((s) => { const pr = pre[s]; if (pr && (pr.f || p === 0) && left[pr.r] > 0) { asg[s] = pr.r; left[pr.r]--; } });

      roles.forEach((r) => { for (let k = 0; k < left[r.id]; k++) slots.push(r.id); });
      for (let k = 0; k < (left[HELP] || 0); k++) slots.push(HELP);

        const ans = hungarian(cost);
        free.forEach((s, i) => (asg[s] = slots[ans[i]]));

      list.forEach((s) => { const r = asg[s]; hist[s][r] = (hist[s][r] || 0) + 1; prev[s] = r; });

      const ids = S.roles.map((r) => r.id); if (all.some((g) => g.some((x) => x.id === HELP))) ids.push(HELP);

  function copyText(text) {
    const fallback = () => {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; } ta.remove(); return ok;
    };
    const done = (ok) => say(ok ? '표를 복사했어요. 한글·엑셀·구글 시트에 붙여 넣으세요.' : '복사하지 못했어요. 인쇄를 이용해 주세요.', ok);
    try {
      if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) { navigator.clipboard.writeText(text).then(() => done(true), () => done(fallback())); return; }

  $('#view').addEventListener('click', (e) => {
    const sw = e.target.closest('[data-sw]'), sl = e.target.closest('[data-slot]'), nv = e.target.closest('[data-nav]'), ax = e.target.closest('[data-axis]');
    if (sw) { swapClick(+sw.dataset.sw, sw.dataset.name); const nb = [...document.querySelectorAll('#view [data-sw]')].find((x) => +x.dataset.sw === +sw.dataset.sw && x.dataset.name === sw.dataset.name); if (nb) nb.focus(); }
    else if (sl) slotClick(+sl.dataset.slot, sl.dataset.role);
    else if (nv && !nv.disabled) go(+nv.dataset.nav);
    else if (ax) { S.axis = ax.dataset.axis; sel = null; renderResult(); save(); }
    
  });
  $('#view').addEventListener('input', (e) => { if (e.target.id === 'filter') { filterText = e.target.value; $('#sgrid').innerHTML = studentCards(); } });
  $('#shuffle').addEventListener('click', () => {
    if (!students().length) return;
    pushUndo(); S.seed = (Math.random() * 1e9) | 0; S.plan = null; update();
    say('새로 섞었어요. 마음에 안 들면 되돌리기를 눌러요.', true);
  });
  $('#undo').addEventListener('click', () => {
    const s = undoStack.pop(); if (!s) return;
    try { const o = JSON.parse(s); PERSIST.forEach((k) => { if (k in o) S[k] = o[k]; }); } catch (e) { /* 무시 */ }
    $('#undo').disabled = !undoStack.length; sel = null;
    $('#names').value = S.names; $('#title').value = S.title; syncPeriodInputs();
    renderRoles(); update(); say('되돌렸어요.', true);
  });
  $('#copy').addEventListener('click', () => { if (S.plan && students().length) copyText(tsv()); });
  $('#print').addEventListener('click', () => { sel = null; renderResult(); try { window.print(); } catch (e) { say('인쇄 창을 열지 못했어요.'); } });

  document.addEventListener('keydown', (e) => {
    if (showOpen) {
      if (e.key === 'Escape') { e.preventDefault(); closeShow(); }
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(-1); }
      else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(1); }
      else if (e.key === 'Tab') { e.preventDefault(); $('#closeShow').focus(); }
      return;
    }
    if (e.key === 'Escape' && sel) { sel = null; say(''); renderResult(); }
  });

  /* ---------- 시작 ---------- */
  document.querySelectorAll('[data-ic]').forEach((b) => b.insertAdjacentHTML('afterbegin', ic(b.dataset.ic)));
  load();
  $('#names').value = S.names; $('#title').value = S.title; $('#remember').checked = S.remember;
  if (!['month', '2w', 'week', 'sem'].includes(S.mode)) S.mode = 'month';
  if (!['poster', 'table', 'student'].includes(S.view)) S.view = 'poster';
  if (!parseYmd(S.start)) S.start = ymd(defaultStart(S.mode));
  syncPeriodInputs(); renderRoles();
  S.cur = currentIndex();
  update();

  // 확인용(화면 동작에는 쓰지 않음)
  window.RolesApp = { state: S, generate, update, students, capsFor, activePre, periodsOf, parseNames, HELP, renderRoles };
})();
</script>
</body>
</html>
